<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Preços | Chama Burguer</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --texto: #fdf6ec;
            --muted: #a0a0a0;
            --laranja: #f59e0b;
            --laranja-hover: #d97706;
            --verde: #10b981;
            --vermelho: #e11d48;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--texto);
            padding: 24px;
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 32px;
            border-bottom: 1px solid #333;
            padding-bottom: 16px;
        }

        .header-admin h1 {
            color: var(--laranja);
            font-size: 1.5rem;
        }

        .btn-voltar {
            color: var(--texto);
            text-decoration: none;
            background: #333;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: var(--laranja);
            color: #000;
        }

        .container-admin {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .abas-admin {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn-aba {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .btn-aba:hover {
            border-color: var(--laranja);
        }

        .btn-aba.ativo {
            background: var(--laranja);
            color: #000;
            border-color: var(--laranja);
        }

        .categoria-admin {
            margin-bottom: 32px;
        }

        .categoria-admin h2 {
            font-size: 1.2rem;
            color: var(--laranja);
            margin-bottom: 16px;
            text-transform: capitalize;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .linha-ingrediente {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 16px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .linha-ingrediente:last-child {
            border-bottom: none;
        }

        .linha-ingrediente span {
            font-weight: 500;
        }

        .input-preco {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: border 0.3s;
        }

        .input-preco:focus {
            border-color: var(--laranja);
        }

        .acoes-admin {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #333;
        }

        .btn-salvar {
            background: var(--verde);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-salvar:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--verde);
            color: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 700;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.4s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            z-index: 1000;
        }

        .toast.ativo {
            transform: translateY(0);
            opacity: 1;
        }

        /* ============================================
           ESTILOS DA TABELA DE RESERVAS
           ============================================ */
        .tabela-reservas {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .tabela-reservas th,
        .tabela-reservas td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .tabela-reservas th {
            background-color: #2a2a2a;
            color: var(--laranja);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .tabela-reservas tr:hover {
            background-color: #252525;
        }

        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .sem-reservas {
            text-align: center;
            color: var(--muted);
            padding: 32px;
            font-style: italic;
        }

        /* Botão de Cancelar Reserva (NOVO) */
        .btn-cancelar {
            background: transparent;
            border: 1px solid transparent;
            color: var(--vermelho);
            /* Ícone vermelho */
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-cancelar:hover {
            background: rgba(225, 29, 72, 0.15);
            /* Fundo vermelho bem clarinho */
            border-color: rgba(225, 29, 72, 0.3);
            color: #ff4d6d;
            /* Vermelho mais vivo */
            transform: scale(1.1);
            /* Efeito de zoom */
        }

        .btn-cancelar:active {
            transform: scale(0.95);
            /* Efeito de clique */
        }
    </style>
</head>

<body>
    <header class="header-admin">
        <h1>⚙️ Painel do Restaurante</h1>
        <a href="index.html" class="btn-voltar">Voltar à Loja</a>
    </header>

    <main class="container-admin">
        <div class="abas-admin">
            <button type="button" class="btn-aba ativo" id="btnTabIngredientes">Ingredientes</button>
            <button type="button" class="btn-aba" id="btnTabProdutos">Lanches Prontos</button>
            <button type="button" class="btn-aba" id="btnTabReservas">📅 Reservas</button>
        </div>
        <div id="containerAdmin">
            <p style="text-align: center; color: var(--muted);">Carregando dados do servidor...</p>
        </div>
    </main>

    <!-- O botão Salvar só aparece nas abas de preços -->
    <div class="acoes-admin" id="acoesSalvar">
        <button type="button" class="btn-salvar" id="btnSalvar">Salvar Alterações</button>
    </div>

    <div class="toast" id="toast">✅ Preços salvos com sucesso!</div>

    <script>
        // PROTEÇÃO DE ACESSO
        if (sessionStorage.getItem('adminAutenticado') !== 'true') {
            window.location.href = 'login.html';
        }

        // ============================================
        // ESTADO GLOBAL E VARIÁVEIS
        // ============================================
        const containerAdmin = document.getElementById('containerAdmin');
        const acoesSalvar = document.getElementById('acoesSalvar');
        let abaAtual = 'ingredientes';

        let dadosIngredientes = {};
        let dadosProdutos = [];

        const ingredientesOriginais = {
            paes: [{ id: 'brioche', nome: 'Pão Brioche', preco: 5.00, img: 'assets/images/pao-brioche.jpg' }, { id: 'australiano', nome: 'Pão Australiano', preco: 6.50, img: 'assets/images/pao-australiano.jpg' }],
            carnes: [{ id: 'carne-160', nome: 'Carne Bovina 160g', preco: 14.00, img: 'assets/images/carne-bovina.jpg' }, { id: 'frango', nome: 'Frango Grelhado', preco: 12.00, img: 'assets/images/frango.jpg' }, { id: 'veggie', nome: 'Grão-de-bico', preco: 13.00, img: 'assets/images/burger-veggie.jpg' }],
            molhos: [{ id: 'maionese', nome: 'Maionese da Casa', preco: 2.00, img: 'assets/images/maionese.jpg' }, { id: 'barbecue', nome: 'Barbecue', preco: 2.50, img: 'assets/images/barbecue.jpg' }, { id: 'picante', nome: 'Picante', preco: 2.50, img: 'assets/images/picante.jpg' }],
            queijos: [{ id: 'cheddar', nome: 'Cheddar', preco: 3.50, img: 'assets/images/cheddar.jpg' }, { id: 'prato', nome: 'Prato', preco: 3.00, img: 'assets/images/prato.jpg' }],
            vegetais: [{ id: 'alface', nome: 'Alface', preco: 1.00, img: 'assets/images/alface.jpg' }, { id: 'tomate', nome: 'Tomate', preco: 1.50, img: 'assets/images/tomate.jpg' }, { id: 'picles', nome: 'Picles', preco: 2.00, img: 'assets/images/picles.jpg' }, { id: 'cebola', nome: 'Cebola Roxa', preco: 1.50, img: 'assets/images/cebola.jpg' }],
            bebidas: [{ id: 'coca', nome: 'Coca-Cola Lata', preco: 6.00, img: 'assets/images/bebida.jpg' }, { id: 'suco', nome: 'Suco de Laranja', preco: 8.00, img: 'assets/images/suco.jpg' }, { id: 'agua', nome: 'Água Mineral', preco: 4.00, img: 'assets/images/agua.jpg' }],
            adicionais: [{ id: 'bacon', nome: 'Bacon', preco: 5.00, img: 'assets/images/burger-bacon.jpg' }, { id: 'ovo', nome: 'Ovo Frito', preco: 2.50, img: 'assets/images/ovo.jpg' }, { id: 'onion', nome: 'Onion Rings', preco: 4.00, img: 'assets/images/onion.jpg' }]
        };

        // ============================================
        // BUSCA DE DADOS (API DO NODE.JS)
        // ============================================
        async function carregarDadosDoServidor() {
            try {
                const resposta = await fetch('http://localhost:3001/api/produtos');
                if (resposta.ok) dadosProdutos = await resposta.json();
            } catch (erro) {
                console.warn("Servidor offline. Usando dados locais para os produtos.");
                dadosProdutos = [
                    { id: 'classico', nome: 'Clássico', preco: 24.90 },
                    { id: 'bacon', nome: 'Bacon', preco: 28.90 },
                    { id: 'veggie', nome: 'Veggie', preco: 26.90 },
                    { id: 'combo', nome: 'Combo Fritas + Refri', preco: 12.90 }
                ];
            }

            const dadosSalvos = JSON.parse(localStorage.getItem('chamaBurguer_precos'));
            dadosIngredientes = JSON.parse(JSON.stringify(ingredientesOriginais));
            if (dadosSalvos) {
                for (const categoria in dadosSalvos) {
                    if (dadosIngredientes[categoria]) {
                        dadosSalvos[categoria].forEach((itemSalvo, index) => {
                            if (dadosIngredientes[categoria][index]) {
                                dadosIngredientes[categoria][index].preco = itemSalvo.preco;
                            }
                        });
                    }
                }
            }
            renderizarAdmin();
        }

        // ============================================
        // RENDERIZAÇÃO DA TELA
        // ============================================
        function renderizarAdmin() {
            containerAdmin.innerHTML = '';

            // Controla a visibilidade do botão Salvar
            acoesSalvar.style.display = abaAtual === 'reservas' ? 'none' : 'flex';

            if (abaAtual === 'ingredientes') {
                for (const categoria in dadosIngredientes) {
                    const divCategoria = document.createElement('div');
                    divCategoria.className = 'categoria-admin';
                    divCategoria.innerHTML = `<h2>${categoria}</h2>`;
                    dadosIngredientes[categoria].forEach((item, index) => {
                        const linha = document.createElement('div');
                        linha.className = 'linha-ingrediente';
                        linha.innerHTML = `<span>${item.nome}</span><input type="number" step="0.01" class="input-preco" data-tipo="ingrediente" data-categoria="${categoria}" data-index="${index}" value="${item.preco.toFixed(2)}">`;
                        divCategoria.appendChild(linha);
                    });
                    containerAdmin.appendChild(divCategoria);
                }
            } else if (abaAtual === 'produtos') {
                const divCategoria = document.createElement('div');
                divCategoria.className = 'categoria-admin';
                divCategoria.innerHTML = `<h2>Lanches Prontos</h2>`;
                dadosProdutos.forEach((item, index) => {
                    const linha = document.createElement('div');
                    linha.className = 'linha-ingrediente';
                    linha.innerHTML = `<span>${item.nome}</span><input type="number" step="0.01" class="input-preco" data-tipo="produto" data-index="${index}" data-id="${item.id}" value="${item.preco.toFixed(2)}">`;
                    divCategoria.appendChild(linha);
                });
                containerAdmin.appendChild(divCategoria);
            } else if (abaAtual === 'reservas') {
                carregarReservas();
            }
        }

        // ============================================
        // ABA DE RESERVAS (NOVO)
        // ============================================
        async function carregarReservas() {
            containerAdmin.innerHTML = '<p style="text-align: center; color: var(--muted);">Buscando reservas...</p>';

            try {
                const resposta = await fetch('http://localhost:3001/api/reservas');
                const reservas = await resposta.json();

                if (reservas.length === 0) {
                    containerAdmin.innerHTML = '<p class="sem-reservas">Nenhuma reserva feita ainda. 🍔</p>';
                    return;
                }

                const tabela = document.createElement('table');
                tabela.className = 'tabela-reservas';
                tabela.innerHTML = `
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Data</th>
                            <th>Pessoas</th>
                            <th>Status</th>
                            <th>Ações</th> <!-- NOVA COLUNA -->
                        </tr>
                    </thead>
                    <tbody>
                        ${reservas.map(r => {
                    const partesData = r.data.split('-');
                    const dataBR = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

                    return `
                            <tr>
                                <td><strong>${r.nome}</strong></td>
                                <td>${r.telefone}</td>
                                <td>${dataBR}</td>
                                <td>${r.pessoas} pessoa(s)</td>
                                <td><span class="status-badge">Confirmada</span></td>
                                <td>
                                    <!-- NOVO BOTÃO DE APAGAR (SVG) -->
    <button class="btn-cancelar" onclick="cancelarReserva(${r.id})" title="Cancelar reserva">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
    </button>
                                </td>
                            </tr>
                            `;
                }).join('')}
                    </tbody>
                `;
                containerAdmin.appendChild(tabela);

            } catch (erro) {
                console.error(erro);
                containerAdmin.innerHTML = '<p class="sem-reservas" style="color: var(--vermelho);">Erro: O servidor Node.js parece estar desligado.</p>';
            }
        }

        // ============================================
        // FUNÇÃO PARA CANCELAR RESERVA (NOVO)
        // ============================================
        async function cancelarReserva(id) {
            // Pergunta ao admin se ele tem certeza
            if (!confirm("Tem certeza que deseja cancelar esta reserva? Essa ação não pode ser desfeita.")) {
                return;
            }

            try {
                const resposta = await fetch(`http://localhost:3001/api/reservas/${id}`, {
                    method: 'DELETE'
                });

                if (resposta.ok) {
                    // Se apagou com sucesso no servidor, recarrega a tabela na tela
                    carregarReservas();

                    // Mostra o toast (usando aquele toast verde que já existe no admin)
                    const toast = document.getElementById('toast');
                    toast.textContent = "🗑️ Reserva cancelada com sucesso!";
                    toast.style.backgroundColor = "var(--vermelho)"; // Muda a cor para vermelho
                    toast.classList.add('ativo');

                    setTimeout(() => {
                        toast.classList.remove('ativo');
                        // Volta a cor original após 3 segundos
                        setTimeout(() => toast.style.backgroundColor = "var(--verde)", 400);
                    }, 3000);
                } else {
                    alert("Erro ao cancelar a reserva no servidor.");
                }
            } catch (erro) {
                console.error(erro);
                alert("Erro de conexão com o servidor.");
            }
        }

        // ============================================
        // SALVAR ALTERAÇÕES DE PREÇO
        // ============================================
        document.getElementById('btnSalvar').addEventListener('click', async () => {
            const inputs = document.querySelectorAll('.input-preco');
            const promessasBackend = [];

            inputs.forEach(input => {
                const tipo = input.dataset.tipo;
                const novoPreco = parseFloat(input.value) || 0;

                if (tipo === 'ingrediente') {
                    const cat = input.dataset.categoria;
                    const index = input.dataset.index;
                    dadosIngredientes[cat][index].preco = novoPreco;
                } else if (tipo === 'produto') {
                    const idProduto = input.dataset.id;
                    const index = input.dataset.index;
                    dadosProdutos[index].preco = novoPreco;

                    promessasBackend.push(
                        fetch(`http://localhost:3001/api/produtos/${idProduto}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ preco: novoPreco })
                        })
                    );
                }
            });

            localStorage.setItem('chamaBurguer_precos', JSON.stringify(dadosIngredientes));

            try {
                await Promise.all(promessasBackend);
                const toast = document.getElementById('toast');
                toast.classList.add('ativo');
                setTimeout(() => toast.classList.remove('ativo'), 3000);
            } catch (erro) {
                alert("Erro ao conectar com o servidor. Alterações não salvas.");
            }
        });

        // ============================================
        // NAVEGAÇÃO DAS ABAS
        // ============================================
        const btnTabIngredientes = document.getElementById('btnTabIngredientes');
        const btnTabProdutos = document.getElementById('btnTabProdutos');
        const btnTabReservas = document.getElementById('btnTabReservas');

        function resetarAbas() {
            btnTabIngredientes.classList.remove('ativo');
            btnTabProdutos.classList.remove('ativo');
            btnTabReservas.classList.remove('ativo');
        }

        btnTabIngredientes.addEventListener('click', () => {
            abaAtual = 'ingredientes'; resetarAbas(); btnTabIngredientes.classList.add('ativo'); renderizarAdmin();
        });

        btnTabProdutos.addEventListener('click', () => {
            abaAtual = 'produtos'; resetarAbas(); btnTabProdutos.classList.add('ativo'); renderizarAdmin();
        });

        btnTabReservas.addEventListener('click', () => {
            abaAtual = 'reservas'; resetarAbas(); btnTabReservas.classList.add('ativo'); renderizarAdmin();
        });

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        carregarDadosDoServidor();
    </script>
</body>

</html>
