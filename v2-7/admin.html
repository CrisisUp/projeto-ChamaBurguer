<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Preços | Chama Burguer</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --texto: #fdf6ec;
            --muted: #a0a0a0;
            --laranja: #f59e0b;
            --laranja-hover: #d97706;
            --verde: #10b981;
            --vermelho: #e11d48;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--texto);
            padding: 24px;
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 32px;
            border-bottom: 1px solid #333;
            padding-bottom: 16px;
        }

        .header-admin h1 {
            color: var(--laranja);
            font-size: 1.5rem;
        }

        .btn-voltar {
            color: var(--texto);
            text-decoration: none;
            background: #333;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: var(--laranja);
            color: #000;
        }

        .container-admin {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .abas-admin {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn-aba {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .btn-aba:hover {
            border-color: var(--laranja);
        }

        .btn-aba.ativo {
            background: var(--laranja);
            color: #000;
            border-color: var(--laranja);
        }

        .categoria-admin {
            margin-bottom: 32px;
        }

        .categoria-admin h2 {
            font-size: 1.2rem;
            color: var(--laranja);
            margin-bottom: 16px;
            text-transform: capitalize;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .linha-ingrediente {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 16px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .linha-ingrediente:last-child {
            border-bottom: none;
        }

        .linha-ingrediente span {
            font-weight: 500;
        }

        .input-preco {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: border 0.3s;
        }

        .input-preco:focus {
            border-color: var(--laranja);
        }

        .acoes-admin {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #333;
        }

        .btn-salvar {
            background: var(--verde);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-salvar:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--verde);
            color: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 700;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.4s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            z-index: 1000;
        }

        .toast.ativo {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <header class="header-admin">
        <h1>⚙️ Painel de Preços</h1>
        <a href="index.html" class="btn-voltar">Voltar à Loja</a>
    </header>

    <main class="container-admin">
        <div class="abas-admin">
            <button class="btn-aba ativo" id="btnTabIngredientes">Ingredientes</button>
            <button class="btn-aba" id="btnTabProdutos">Lanches Prontos</button>
        </div>
        <div id="containerAdmin"></div>
    </main>

    <div class="acoes-admin">
        <button class="btn-salvar" id="btnSalvar">Salvar Alterações</button>
    </div>

    <div class="toast" id="toast">✅ Preços salvos com sucesso!</div>

    <script>
        // PROTEÇÃO DE ACESSO
        if (sessionStorage.getItem('adminAutenticado') !== 'true') {
            window.location.href = 'login.html';
        }

        const ingredientesOriginais = {
            paes: [{ id: 'brioche', nome: 'Pão Brioche', preco: 5.00, img: 'assets/images/pao-brioche.jpg' }, { id: 'australiano', nome: 'Pão Australiano', preco: 6.50, img: 'assets/images/pao-australiano.jpg' }],
            carnes: [{ id: 'carne-160', nome: 'Carne Bovina 160g', preco: 14.00, img: 'assets/images/carne-bovina.jpg' }, { id: 'frango', nome: 'Frango Grelhado', preco: 12.00, img: 'assets/images/frango.jpg' }, { id: 'veggie', nome: 'Grão-de-bico', preco: 13.00, img: 'assets/images/burger-veggie.jpg' }],
            molhos: [{ id: 'maionese', nome: 'Maionese da Casa', preco: 2.00, img: 'assets/images/maionese.jpg' }, { id: 'barbecue', nome: 'Barbecue', preco: 2.50, img: 'assets/images/barbecue.jpg' }, { id: 'picante', nome: 'Picante', preco: 2.50, img: 'assets/images/picante.jpg' }],
            queijos: [{ id: 'cheddar', nome: 'Cheddar', preco: 3.50, img: 'assets/images/cheddar.jpg' }, { id: 'prato', nome: 'Prato', preco: 3.00, img: 'assets/images/prato.jpg' }],
            vegetais: [{ id: 'alface', nome: 'Alface', preco: 1.00, img: 'assets/images/alface.jpg' }, { id: 'tomate', nome: 'Tomate', preco: 1.50, img: 'assets/images/tomate.jpg' }, { id: 'picles', nome: 'Picles', preco: 2.00, img: 'assets/images/picles.jpg' }, { id: 'cebola', nome: 'Cebola Roxa', preco: 1.50, img: 'assets/images/cebola.jpg' }],
            bebidas: [{ id: 'coca', nome: 'Coca-Cola Lata', preco: 6.00, img: 'assets/images/bebida.jpg' }, { id: 'suco', nome: 'Suco de Laranja', preco: 8.00, img: 'assets/images/suco.jpg' }, { id: 'agua', nome: 'Água Mineral', preco: 4.00, img: 'assets/images/agua.jpg' }],
            adicionais: [{ id: 'bacon', nome: 'Bacon', preco: 5.00, img: 'assets/images/burger-bacon.jpg' }, { id: 'ovo', nome: 'Ovo Frito', preco: 2.50, img: 'assets/images/ovo.jpg' }, { id: 'onion', nome: 'Onion Rings', preco: 4.00, img: 'assets/images/onion.jpg' }]
        };

        const produtosOriginais = [
            { id: 'classico', nome: 'Clássico', preco: 24.90 },
            { id: 'bacon', nome: 'Bacon', preco: 28.90 },
            { id: 'veggie', nome: 'Veggie', preco: 26.90 },
            { id: 'combo', nome: 'Combo Fritas + Refri', preco: 12.90 }
        ];

        let dadosSalvos = JSON.parse(localStorage.getItem('chamaBurguer_precos'));
        let dadosIngredientes = JSON.parse(JSON.stringify(ingredientesOriginais));
        if (dadosSalvos) {
            for (const categoria in dadosSalvos) {
                if (dadosIngredientes[categoria]) {
                    dadosSalvos[categoria].forEach((itemSalvo, index) => {
                        if (dadosIngredientes[categoria][index]) dadosIngredientes[categoria][index].preco = itemSalvo.preco;
                    });
                }
            }
        }

        let dadosProdutos = JSON.parse(localStorage.getItem('chamaBurguer_produtos')) || JSON.parse(JSON.stringify(produtosOriginais));
        const containerAdmin = document.getElementById('containerAdmin');
        let abaAtual = 'ingredientes';

        function renderizarAdmin() {
            containerAdmin.innerHTML = '';
            if (abaAtual === 'ingredientes') {
                for (const categoria in dadosIngredientes) {
                    const divCategoria = document.createElement('div');
                    divCategoria.className = 'categoria-admin';
                    divCategoria.innerHTML = `<h2>${categoria}</h2>`;
                    dadosIngredientes[categoria].forEach((item, index) => {
                        const linha = document.createElement('div');
                        linha.className = 'linha-ingrediente';
                        linha.innerHTML = `<span>${item.nome}</span><input type="number" step="0.01" class="input-preco" data-tipo="ingrediente" data-categoria="${categoria}" data-index="${index}" value="${item.preco.toFixed(2)}">`;
                        divCategoria.appendChild(linha);
                    });
                    containerAdmin.appendChild(divCategoria);
                }
            } else {
                const divCategoria = document.createElement('div');
                divCategoria.className = 'categoria-admin';
                divCategoria.innerHTML = `<h2>Lanches Prontos</h2>`;
                dadosProdutos.forEach((item, index) => {
                    const linha = document.createElement('div');
                    linha.className = 'linha-ingrediente';
                    linha.innerHTML = `<span>${item.nome}</span><input type="number" step="0.01" class="input-preco" data-tipo="produto" data-index="${index}" value="${item.preco.toFixed(2)}">`;
                    divCategoria.appendChild(linha);
                });
                containerAdmin.appendChild(divCategoria);
            }
        }

        document.getElementById('btnSalvar').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.input-preco');

            inputs.forEach(input => {
                const tipo = input.dataset.tipo;
                const novoPreco = parseFloat(input.value) || 0;

                if (tipo === 'ingrediente') {
                    const cat = input.dataset.categoria;
                    const index = input.dataset.index;
                    dadosIngredientes[cat][index].preco = novoPreco;
                    // Atualiza os dados na memória
                    dadosIngredientes[cat][index].preco = novoPreco;
                } else if (tipo === 'produto') {
                    const index = input.dataset.index;
                    dadosProdutos[index].preco = novoPreco;
                }
            });

            // 👇 SALVA AMBOS OS DADOS FORA DO LOOP
            localStorage.setItem('chamaBurguer_precos', JSON.stringify(dadosIngredientes));
            localStorage.setItem('chamaBurguer_produtos', JSON.stringify(dadosProdutos));

            const toast = document.getElementById('toast');
            toast.classList.add('ativo');
            setTimeout(() => toast.classList.remove('ativo'), 3000);
        });

        document.getElementById('btnTabIngredientes').addEventListener('click', () => {
            abaAtual = 'ingredientes';
            document.getElementById('btnTabIngredientes').classList.add('ativo');
            document.getElementById('btnTabProdutos').classList.remove('ativo');
            renderizarAdmin();
        });

        document.getElementById('btnTabProdutos').addEventListener('click', () => {
            abaAtual = 'produtos';
            document.getElementById('btnTabProdutos').classList.add('ativo');
            document.getElementById('btnTabIngredientes').classList.remove('ativo');
            renderizarAdmin();
        });

        renderizarAdmin();
    </script>
</body>

</html>
