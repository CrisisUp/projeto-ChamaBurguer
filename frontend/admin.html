<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Restaurante | Chama Burguer</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --texto: #fdf6ec;
            --muted: #a0a0a0;
            --laranja: #f59e0b;
            --laranja-hover: #d97706;
            --verde: #10b981;
            --vermelho: #e11d48;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--texto);
            padding: 24px;
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 32px;
            border-bottom: 1px solid #333;
            padding-bottom: 16px;
        }

        .header-admin h1 {
            color: var(--laranja);
            font-size: 1.5rem;
        }

        .btn-voltar {
            color: var(--texto);
            text-decoration: none;
            background: #333;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: var(--laranja);
            color: #000;
        }

        .container-admin {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .abas-admin {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn-aba {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .btn-aba:hover {
            border-color: var(--laranja);
        }

        .btn-aba.ativo {
            background: var(--laranja);
            color: #000;
            border-color: var(--laranja);
        }

        .categoria-admin {
            margin-bottom: 32px;
        }

        .categoria-admin h2 {
            font-size: 1.2rem;
            color: var(--laranja);
            margin-bottom: 16px;
            text-transform: capitalize;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .linha-ingrediente {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 16px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .linha-ingrediente:last-child {
            border-bottom: none;
        }

        .linha-ingrediente span {
            font-weight: 500;
        }

        .input-preco {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: border 0.3s;
        }

        .input-preco:focus {
            border-color: var(--laranja);
        }

        .acoes-admin {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #333;
        }

        .btn-salvar {
            background: var(--verde);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-salvar:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--verde);
            color: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 700;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.4s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            z-index: 1000;
        }

        .toast.ativo {
            transform: translateY(0);
            opacity: 1;
        }

        /* Tabela de Reservas */
        .tabela-reservas {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .tabela-reservas th,
        .tabela-reservas td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .tabela-reservas th {
            background-color: #2a2a2a;
            color: var(--laranja);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .tabela-reservas tr:hover {
            background-color: #252525;
        }

        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .sem-reservas {
            text-align: center;
            color: var(--muted);
            padding: 32px;
            font-style: italic;
        }

        /* Botão de Cancelar */
        .btn-cancelar {
            background: transparent;
            border: 1px solid transparent;
            color: var(--vermelho);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-cancelar:hover {
            background: rgba(225, 29, 72, 0.15);
            border-color: rgba(225, 29, 72, 0.3);
            color: #ff4d6d;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <header class="header-admin">
        <h1>⚙️ Painel do Restaurante</h1>
        <a href="index.html" class="btn-voltar">Voltar à Loja</a>
    </header>

    <main class="container-admin">
        <div class="abas-admin">
            <button type="button" class="btn-aba ativo" id="btnTabIngredientes">Ingredientes</button>
            <button type="button" class="btn-aba" id="btnTabProdutos">Lanches Prontos</button>
            <button type="button" class="btn-aba" id="btnTabReservas">📅 Reservas</button>
        </div>
        <div id="containerAdmin">
            <p style="text-align: center; color: var(--muted);">Carregando dados do servidor...</p>
        </div>
    </main>

    <div class="acoes-admin" id="acoesSalvar">
        <button type="button" class="btn-salvar" id="btnSalvar">Salvar Alterações</button>
    </div>

    <div class="toast" id="toast">✅ Alterações salvas com sucesso!</div>

    <script>
        // PROTEÇÃO DE ACESSO
        if (sessionStorage.getItem('adminAutenticado') !== 'true') {
            window.location.href = 'login.html';
        }

        // ============================================
        // ESTADO GLOBAL
        // ============================================
        const containerAdmin = document.getElementById('containerAdmin');
        const acoesSalvar = document.getElementById('acoesSalvar');
        let abaAtual = 'ingredientes';

        let dadosIngredientes = {};
        let dadosProdutos = [];

        // ============================================
        // BUSCA DE DADOS (API NODE.JS)
        // ============================================
        async function carregarDadosDoServidor() {
            containerAdmin.innerHTML = '<p style="text-align: center; color: var(--muted);">Conectando ao servidor...</p>';

            try {
                // 1. Busca Lanches Prontos
                const resProdutos = await fetch('http://localhost:3001/api/produtos');
                if (resProdutos.ok) dadosProdutos = await resProdutos.json();

                // 2. Busca Ingredientes e Agrupa por Categoria
                const resIngredientes = await fetch('http://localhost:3001/api/ingredientes');
                if (resIngredientes.ok) {
                    const listaPlana = await resIngredientes.json();

                    // Limpa o objeto antes de agrupar
                    dadosIngredientes = {};

                    listaPlana.forEach(item => {
                        if (!dadosIngredientes[item.categoria]) {
                            dadosIngredientes[item.categoria] = [];
                        }
                        dadosIngredientes[item.categoria].push(item);
                    });
                }

                renderizarAdmin();
            } catch (erro) {
                console.error("Erro ao conectar com o Backend:", erro);
                containerAdmin.innerHTML = '<p class="sem-reservas" style="color: var(--vermelho);">Servidor Node.js offline. Ligue o terminal (`node server.js`) e recarregue.</p>';
            }
        }

        // ============================================
        // RENDERIZAÇÃO DA TELA
        // ============================================
        function renderizarAdmin() {
            containerAdmin.innerHTML = '';
            acoesSalvar.style.display = abaAtual === 'reservas' ? 'none' : 'flex';

            if (abaAtual === 'ingredientes') {
                for (const categoria in dadosIngredientes) {
                    const divCategoria = document.createElement('div');
                    divCategoria.className = 'categoria-admin';
                    divCategoria.innerHTML = `<h2>${categoria}</h2>`;

                    dadosIngredientes[categoria].forEach((item, index) => {
                        const linha = document.createElement('div');
                        linha.className = 'linha-ingrediente';
                        // Adicionado data-id e data-tipo para o backend identificar
                        linha.innerHTML = `
                            <span>${item.nome}</span>
                            <input type="number" step="0.01" class="input-preco" 
                                   data-tipo="ingrediente" 
                                   data-id="${item.id}" 
                                   value="${item.preco.toFixed(2)}">
                        `;
                        divCategoria.appendChild(linha);
                    });
                    containerAdmin.appendChild(divCategoria);
                }
            } else if (abaAtual === 'produtos') {
                const divCategoria = document.createElement('div');
                divCategoria.className = 'categoria-admin';
                divCategoria.innerHTML = `<h2>Lanches Prontos</h2>`;

                dadosProdutos.forEach((item, index) => {
                    const linha = document.createElement('div');
                    linha.className = 'linha-ingrediente';
                    linha.innerHTML = `
                        <span>${item.nome}</span>
                        <input type="number" step="0.01" class="input-preco" 
                               data-tipo="produto" 
                               data-id="${item.id}" 
                               value="${item.preco.toFixed(2)}">
                    `;
                    divCategoria.appendChild(linha);
                });
                containerAdmin.appendChild(divCategoria);
            } else if (abaAtual === 'reservas') {
                carregarReservas();
            }
        }

        // ============================================
        // ABA DE RESERVAS
        // ============================================
        async function carregarReservas() {
            containerAdmin.innerHTML = '<p style="text-align: center; color: var(--muted);">Buscando reservas...</p>';
            try {
                const resposta = await fetch('http://localhost:3001/api/reservas');
                const reservas = await resposta.json();

                if (reservas.length === 0) {
                    containerAdmin.innerHTML = '<p class="sem-reservas">Nenhuma reserva feita ainda. 🍔</p>';
                    return;
                }

                const tabela = document.createElement('table');
                tabela.className = 'tabela-reservas';
                tabela.innerHTML = `
                    <thead>
                        <tr><th>Nome</th><th>Telefone</th><th>Data</th><th>Pessoas</th><th>Status</th><th>Ações</th></tr>
                    </thead>
                    <tbody>
                        ${reservas.map(r => {
                    const partesData = r.data.split('-');
                    const dataBR = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;
                    return `
                            <tr>
                                <td><strong>${r.nome}</strong></td>
                                <td>${r.telefone}</td>
                                <td>${dataBR}</td>
                                <td>${r.pessoas} pessoa(s)</td>
                                <td><span class="status-badge">Confirmada</span></td>
                                <td>
                                    <button class="btn-cancelar" onclick="cancelarReserva(${r.id})" title="Cancelar reserva">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            <line x1="10" y1="11" x2="10" y2="17"></line>
                                            <line x1="14" y1="11" x2="14" y2="17"></line>
                                        </svg>
                                    </button>
                                </td>
                            </tr>`;
                }).join('')}
                    </tbody>
                `;
                containerAdmin.appendChild(tabela);
            } catch (erro) {
                containerAdmin.innerHTML = '<p class="sem-reservas" style="color: var(--vermelho);">Servidor offline.</p>';
            }
        }

        async function cancelarReserva(id) {
            if (!confirm("Tem certeza que deseja cancelar esta reserva?")) return;
            try {
                const resposta = await fetch(`http://localhost:3001/api/reservas/${id}`, { method: 'DELETE' });
                if (resposta.ok) {
                    carregarReservas();
                    const toast = document.getElementById('toast');
                    toast.textContent = "🗑️ Reserva cancelada!";
                    toast.style.backgroundColor = "var(--vermelho)";
                    toast.classList.add('ativo');
                    setTimeout(() => {
                        toast.classList.remove('ativo');
                        setTimeout(() => toast.style.backgroundColor = "var(--verde)", 400);
                    }, 3000);
                }
            } catch (erro) { alert("Erro de conexão."); }
        }

        // ============================================
        // SALVAR ALTERAÇÕES
        // ============================================
        document.getElementById('btnSalvar').addEventListener('click', async () => {
            const inputs = document.querySelectorAll('.input-preco');
            const promessas = [];

            inputs.forEach(input => {
                const tipo = input.dataset.tipo;
                const id = input.dataset.id;
                const novoPreco = parseFloat(input.value) || 0;

                if (tipo === 'ingrediente') {
                    promessas.push(fetch(`http://localhost:3001/api/ingredientes/${id}`, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ preco: novoPreco })
                    }));
                } else if (tipo === 'produto') {
                    promessas.push(fetch(`http://localhost:3001/api/produtos/${id}`, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ preco: novoPreco })
                    }));
                }
            });

            try {
                await Promise.all(promessas);
                const toast = document.getElementById('toast');
                toast.textContent = "✅ Preços salvos!";
                toast.classList.add('ativo');
                setTimeout(() => toast.classList.remove('ativo'), 3000);
            } catch (erro) {
                alert("Erro ao conectar com o servidor.");
            }
        });

        // ============================================
        // NAVEGAÇÃO DAS ABAS
        // ============================================
        const btnTabIngredientes = document.getElementById('btnTabIngredientes');
        const btnTabProdutos = document.getElementById('btnTabProdutos');
        const btnTabReservas = document.getElementById('btnTabReservas');

        function resetarAbas() {
            btnTabIngredientes.classList.remove('ativo');
            btnTabProdutos.classList.remove('ativo');
            btnTabReservas.classList.remove('ativo');
        }

        btnTabIngredientes.addEventListener('click', () => { abaAtual = 'ingredientes'; resetarAbas(); btnTabIngredientes.classList.add('ativo'); renderizarAdmin(); });
        btnTabProdutos.addEventListener('click', () => { abaAtual = 'produtos'; resetarAbas(); btnTabProdutos.classList.add('ativo'); renderizarAdmin(); });
        btnTabReservas.addEventListener('click', () => { abaAtual = 'reservas'; resetarAbas(); btnTabReservas.classList.add('ativo'); renderizarAdmin(); });

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        carregarDadosDoServidor();
    </script>
</body>

</html>
